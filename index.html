<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<div x-data="app()" class="max-w-4xl mx-auto p-4">
    <!-- Screen 1: Name Input -->
    <div x-show="step === 1" x-cloak class="bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">ようこそ</h1>
        <p class="mb-4">お名前を入力してください。</p>
        <input type="text" x-model="userName" class="border p-2 w-full rounded mb-4" placeholder="名前を入力">
        <button @click="saveName()" class="bg-blue-600 text-white px-4 py-2 rounded">次へ</button>
    </div>

    <!-- Screen 2: Project Creation/Selection -->
    <div x-show="step === 2" x-cloak class="bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">こんにちは、<span x-text="userName"></span>さん</h1>
        <h2 class="text-xl mb-4">プロジェクトを選択または作成</h2>
        
        <div class="grid grid-cols-5 gap-2 mb-6">
            <template x-for="icon in icons" :key="icon">
                <button @click="selectedIcon = icon" 
                        :class="{'bg-blue-200': selectedIcon === icon}"
                        class="p-2 border rounded hover:bg-gray-200">
                    <span x-text="icon"></span>
                </button>
            </template>
        </div>

        <input type="text" x-model="newProjectName" class="border p-2 w-full rounded mb-4" placeholder="プロジェクト名">
        <button @click="createProject()" class="bg-green-600 text-white px-4 py-2 rounded mb-6">プロジェクトを作成</button>

        <div class="mt-4">
            <h3 class="font-bold mb-2">過去のプロジェクト</h3>
            <template x-for="project in projects" :key="project.id">
                <div @click="selectProject(project)" class="p-3 border-b cursor-pointer hover:bg-gray-50 flex items-center">
                    <span class="mr-2" x-text="project.icon"></span> <span x-text="project.name"></span>
                </div>
            </template>
        </div>
    </div>

    <!-- Screen 3: Item/Product Selection -->
    <div x-show="step === 3" x-cloak class="bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">製品/項目を選択</h1>
        <div class="grid grid-cols-2 gap-4">
            <button class="p-4 border rounded hover:bg-blue-50">製品 A</button>
            <button class="p-4 border rounded hover:bg-blue-50">製品 B</button>
            <button class="p-4 border rounded hover:bg-blue-50">項目 X</button>
            <button class="p-4 border rounded hover:bg-blue-50">項目 Y</button>
        </div>
        <button @click="step = 2" class="mt-6 text-gray-600">← 戻る</button>
    </div>
</div>

<script>
function app() {
    return {
        step: 1,
        userName: '',
        selectedIcon: '📁',
        newProjectName: '',
        projects: [],
        icons: ['📁', '📂', '📄', '📊', '📅', '📝', '🛠', '⚙️', '💡', '🚀', '🌟', '💻', '📱', '📷', '🎨', '🔥', '💧', '🌿', '🍎', '🚗', '✈️', '🏠', '🏢', '⌚', '🎧', '🎸', '⚽', '🏀', '📚', '🔐', '🎯', '📍', '🌍', '📡', '🔍', '🔋', '🔌', '🖨', '📠', '💿', '💾', '📼', '🎥', '🎭', '🎪', '🎢', '🎡', '🎨', '🧩'],
        
        init() {
            this.userName = localStorage.getItem('userName') || '';
            if (this.userName) this.step = 2;
            this.projects = JSON.parse(localStorage.getItem('projects') || '[]');
        },
        saveName() {
            if (!this.userName) return;
            localStorage.setItem('userName', this.userName);
            this.step = 2;
        },
        createProject() {
            if (!this.newProjectName) return;
            const newProj = { id: Date.now(), name: this.newProjectName, icon: this.selectedIcon };
            this.projects.push(newProj);
            localStorage.setItem('projects', JSON.stringify(this.projects));
            this.newProjectName = '';
            this.selectProject(newProj);
        },
        selectProject(project) {
            this.step = 3;
        }
    }
}
</script>
</body>
</html>
