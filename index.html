<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族の検討リスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

    <div class="max-w-md mx-auto p-4">
        <header class="text-center mb-6 mt-4">
            <h1 class="text-2xl font-extrabold text-gray-800">🏡 家族の検討リスト</h1>
        </header>

        <!-- 入力エリア -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mb-6">
            <!-- ①プロジェクト設定 -->
            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">1. プロジェクト名</label>
            <select id="projectSelect" onchange="updateCategoryDropdown()" class="w-full p-3 bg-gray-50 rounded-xl mb-3 font-bold"></select>
            <input type="text" id="newProjectInput" placeholder="新しいプロジェクト名を入力" class="hidden w-full p-3 bg-indigo-50 rounded-xl mb-3 text-indigo-800">

            <!-- ②カテゴリ（製品）設定 -->
            <label class="block text-xs font-bold text-gray-400 uppercase mb-1 mt-2">2. 製品・項目名</label>
            <select id="categorySelect" class="w-full p-3 bg-gray-50 rounded-xl mb-3 font-bold"></select>
            <input type="text" id="newCategoryInput" placeholder="新しい製品カテゴリを入力" class="hidden w-full p-3 bg-indigo-50 rounded-xl mb-3 text-indigo-800">

            <div class="border-t pt-4">
                <input type="url" id="url" placeholder="URL" class="w-full p-3 bg-gray-50 rounded-xl mb-2 text-sm">
                <textarea id="comment" placeholder="コメント・メモ" class="w-full p-3 bg-gray-50 rounded-xl mb-3 text-sm h-20"></textarea>
                <button id="addBtn" onclick="addItem()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold">追加する</button>
            </div>
        </div>

        <div id="items-list" class="space-y-4"></div>
    </div>

    <script>
        const API_BASE_URL = "https://application-for-family-discussion.onrender.com/api";
        let allData = [];

        window.onload = async () => {
            try {
                const res = await fetch(`${API_BASE_URL}/items`);
                allData = await res.json();
                renderUI();
            } catch(e) { document.body.innerHTML = "サーバーエラー: 数分待ってリロードしてください。"; }
        };

        function renderUI() {
            const projects = [...new Set(allData.map(d => d.project_name))];
            const pSelect = document.getElementById('projectSelect');
            pSelect.innerHTML = `<option value="__new__">＋ 新規プロジェクト</option>` + projects.map(p => `<option value="${p}">${p}</option>`).join('');
            updateCategoryDropdown();
        }

        function updateCategoryDropdown() {
            const pVal = document.getElementById('projectSelect').value;
            const newP = document.getElementById('newProjectInput');
            newP.classList.toggle('hidden', pVal !== '__new__');
            
            const filtered = allData.filter(d => d.project_name === pVal);
            const cats = [...new Set(filtered.map(d => d.category))];
            const cSelect = document.getElementById('categorySelect');
            cSelect.innerHTML = `<option value="__new__">＋ 新しい製品カテゴリ</option>` + cats.map(c => `<option value="${c}">${c}</option>`).join('');
            updateCategoryInputs();
        }

        function updateCategoryInputs() {
            const cVal = document.getElementById('categorySelect').value;
            document.getElementById('newCategoryInput').classList.toggle('hidden', cVal !== '__new__');
        }

        document.getElementById('categorySelect').onchange = updateCategoryInputs;

        async function addItem() {
            const pName = document.getElementById('projectSelect').value === '__new__' ? document.getElementById('newProjectInput').value : document.getElementById('projectSelect').value;
            const cat = document.getElementById('categorySelect').value === '__new__' ? document.getElementById('newCategoryInput').value : document.getElementById('categorySelect').value;
            const url = document.getElementById('url').value;
            const comment = document.getElementById('comment').value;

            if(!pName || !cat || !url) return alert("全て入力してください");

            await fetch(`${API_BASE_URL}/items`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ project_name: pName, category: cat, url, comment })
            });
            location.reload(); // シンプルにリロードで反映
        }
    </script>
</body>
</html>
