<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>検討リスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 50; justify-content: center; align-items: center; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- ローディングアニメーション -->
    <div id="loader" class="loading-overlay"><div class="animate-spin text-4xl">⏳</div></div>

    <div class="max-w-md mx-auto p-4" id="app">
        <!-- ログイン画面 -->
        <div id="screen-login">
            <h1 class="text-2xl font-bold text-center mt-10 mb-6">あなたのお名前は？</h1>
            <input type="text" id="username-input" class="w-full p-4 rounded-xl border mb-4" placeholder="例：宏紀">
            <button onclick="login()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold">スタート</button>
        </div>

        <!-- メイン画面 -->
        <div id="screen-main" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <span id="user-display" class="font-bold text-gray-700"></span>
                <button onclick="logout()" class="text-xs text-gray-400">切り替え</button>
            </div>
            
            <div id="project-list" class="space-y-4"></div>
            
            <!-- 新規追加エリア -->
            <div class="mt-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h3 class="font-bold mb-4">新規追加</h3>
                <input type="text" id="add-proj" placeholder="プロジェクト名" class="w-full p-2 border rounded mb-2">
                <input type="text" id="add-cat" placeholder="カテゴリ" class="w-full p-2 border rounded mb-2">
                <input type="text" id="add-url" placeholder="URL" class="w-full p-2 border rounded mb-2">
                <input type="number" id="add-price" placeholder="金額" class="w-full p-2 border rounded mb-2">
                <button onclick="addItem()" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold">登録</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://application-for-family-discussion.onrender.com/api";
        let currentUser = localStorage.getItem("username");
        let allData = [];

        function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }

        function login() {
            const name = document.getElementById('username-input').value;
            if(!name) return;
            localStorage.setItem("username", name);
            currentUser = name;
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
            loadData();
        }

        async function loadData() {
            showLoader(true);
            const res = await fetch(`${API_URL}/items`);
            allData = await res.json();
            render();
            showLoader(false);
        }

        function render() {
            const container = document.getElementById('project-list');
            document.getElementById('user-display').innerText = `ログイン中: ${currentUser}`;
            
            const projects = [...new Set(allData.map(i => i.project_name))];
            container.innerHTML = projects.map(p => {
                const items = allData.filter(i => i.project_name === p);
                const total = items.filter(i => i.is_decided).reduce((sum, i) => sum + (i.price || 0), 0);
                return `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                        <div class="flex justify-between font-bold text-lg">${p} <span>¥${total.toLocaleString()}</span></div>
                        ${renderCategories(items)}
                    </div>`;
            }).join('');
        }

        function renderCategories(items) {
            const cats = [...new Set(items.map(i => i.category))];
            return cats.map(c => {
                const catItems = items.filter(i => i.category === c);
                return `
                    <details class="mt-4 border-t pt-2" open>
                        <summary class="font-bold text-indigo-700 cursor-pointer">${c}</summary>
                        <div class="space-y-2 mt-2">${catItems.map(item => `
                            <div class="p-3 bg-gray-50 rounded-xl flex items-center gap-3">
                                <input type="checkbox" ${item.is_decided ? 'checked' : ''} onchange="toggleDecided('${item.id}', this.checked)">
                                <div class="flex-grow">
                                    <a href="${item.url}" target="_blank" class="text-sm font-bold block">${item.title || 'リンク'}</a>
                                    <div class="text-xs text-gray-500">¥${item.price.toLocaleString()}</div>
                                </div>
                                <div class="text-xl">Rating: ${item.user_ratings[currentUser] || 0}</div>
                            </div>
                        `).join('')}</div>
                    </details>`;
            }).join('');
        }

        async function addItem() {
            showLoader(true);
            const payload = {
                project_name: document.getElementById('add-proj').value,
                category: document.getElementById('add-cat').value,
                url: document.getElementById('add-url').value,
                price: parseInt(document.getElementById('add-price').value),
                user_ratings: {[currentUser]: 3}
            };
            await fetch(`${API_URL}/items`, { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
            await loadData();
            showLoader(false);
        }

        window.onload = () => currentUser ? login() : null;
        function logout() { localStorage.removeItem("username"); location.reload(); }
    </script>
</body>
</html>
