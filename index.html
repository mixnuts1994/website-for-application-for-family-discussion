<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年 新居照明計画</title>
    <!-- スタイリングにTailwind CSSを使用 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <div class="max-w-md mx-auto p-4">
        <!-- ヘッダー -->
        <header class="text-center mb-6 mt-4">
            <h1 class="text-2xl font-extrabold text-gray-800">🏡 新居照明計画</h1>
            <p class="text-gray-500 text-sm">検討中アイテムを整理しよう</p>
        </header>

        <!-- 登録フォーム -->
        <div class="bg-white p-6 rounded-3xl shadow-lg border border-gray-100 mb-6">
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">設置場所</label>
                <select id="category" class="w-full p-3 bg-gray-50 rounded-xl border-none focus:ring-2 focus:ring-indigo-500">
                    <option>キッチンダウンライト</option>
                    <option>玄関シーリングライト</option>
                    <option>ダイニングペンダント</option>
                    <option>リビングスポットライト</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">商品URL</label>
                <input type="url" id="url" placeholder="https://..." class="w-full p-3 bg-gray-50 rounded-xl border-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button id="addBtn" onclick="addItem()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold hover:bg-indigo-700 transition active:scale-95 shadow-md">
                リストに追加
            </button>
        </div>

        <!-- AI提案エリア -->
        <button id="aiBtn" onclick="getRecommendation()" class="w-full bg-gradient-to-r from-purple-500 to-indigo-600 text-white p-4 rounded-3xl font-bold mb-6 shadow-lg hover:shadow-xl transition active:scale-95 flex justify-center items-center gap-2">
            ✨ AIにおすすめを相談する
        </button>
        <div id="ai-result" class="bg-white p-5 rounded-2xl mb-6 text-sm text-gray-700 hidden shadow-sm border-l-4 border-purple-500 whitespace-pre-wrap"></div>

        <!-- 一覧表示エリア -->
        <h2 class="text-sm font-bold text-gray-500 mb-4 px-2 uppercase tracking-wider">検討中リスト</h2>
        <div id="items-list" class="grid grid-cols-2 gap-4">
            <!-- JavaScriptでここにカードが生成されます -->
            <div class="col-span-2 text-center py-10 text-gray-400">読み込み中...</div>
        </div>
    </div>

    <script>
        // ★重要: ここをあなたのRenderのURL（末尾に/apiを付けたもの）に書き換えてください
        const API_BASE_URL = "https://application-for-family-discussion.onrender.com/api";

        window.onload = fetchItems;

        async function fetchItems() {
            try {
                const res = await fetch(`${API_BASE_URL}/items`);
                const items = await res.json();
                const list = document.getElementById('items-list');
                list.innerHTML = items.length ? '' : '<div class="col-span-2 text-center py-10 text-gray-400">まだ登録がありません</div>';
                
                items.forEach(item => {
                    list.innerHTML += `
                        <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 flex flex-col">
                            <img src="${item.image_url || 'https://via.placeholder.com/150'}" class="h-28 w-full object-cover bg-gray-200">
                            <div class="p-3 flex-grow">
                                <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">${item.category}</span>
                                <p class="text-xs font-bold text-gray-800 mt-2 line-clamp-2 leading-tight">${item.title}</p>
                            </div>
                            <div class="p-2 border-t border-gray-50">
                                <a href="${item.url}" target="_blank" class="block text-center text-[10px] font-bold text-gray-400 hover:text-indigo-600">サイトを見る</a>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                document.getElementById('items-list').innerHTML = '<div class="col-span-2 text-center py-10 text-red-400">エラーが発生しました。APIが起動中か確認してください。</div>';
            }
        }

        async function addItem() {
            const btn = document.getElementById('addBtn');
            const url = document.getElementById('url').value;
            if(!url) return alert("URLを入力してください");

            btn.disabled = true;
            btn.innerText = "登録中...";
            
            await fetch(`${API_BASE_URL}/items`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ category: document.getElementById('category').value, url })
            });
            
            document.getElementById('url').value = '';
            btn.disabled = false;
            btn.innerText = "リストに追加";
            fetchItems();
        }

        async function getRecommendation() {
            const btn = document.getElementById('aiBtn');
            const resultDiv = document.getElementById('ai-result');
            
            btn.disabled = true;
            btn.innerText = "🤔 分析中...";
            resultDiv.classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE_URL}/recommend`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ category: document.getElementById('category').value })
                });
                const data = await res.json();
                resultDiv.innerText = data.recommendation;
                resultDiv.classList.remove('hidden');
            } catch(e) {
                alert("AIの分析に失敗しました");
            }
            btn.disabled = false;
            btn.innerText = "✨ AIにおすすめを相談する";
        }
    </script>
</body>
</html>
